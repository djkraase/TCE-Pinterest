name: Render review-first sales Pin creative
on:
  pull_request:
    paths:
      - 'campaign/creative_specs.json'
      - 'scripts/render_sales_pin.py'
      - 'tests/test_render_sales_pin.py'
      - '.github/workflows/render-sales-creative.yml'
  push:
    branches: [main]
    paths:
      - 'campaign/creative_specs.json'
      - 'campaign/pins.json'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install deterministic image renderer
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'Pillow==11.3.0'
      - name: Test publication rules and commercial artwork
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Render review previews
        run: .venv/bin/python scripts/render_sales_pin.py --output-dir rendered
      - name: Attach review images (not public Pins)
        uses: actions/upload-artifact@v4
        with:
          name: sales-pin-review
          path: rendered/*.png
          if-no-files-found: error
          retention-days: 14

  host-after-reviewed-merge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install renderer
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'Pillow==11.3.0'
      - name: Generate only separately approved and digest-matched images
        run: .venv/bin/python scripts/render_sales_pin.py --approved-only --output-dir assets
      - name: Commit only generated artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/tce_pin_[0-9][0-9]_publish.png
          if ! git diff --cached --quiet; then
            git commit -m "Render commercial Pin images from reviewed specs"
            git push origin HEAD:main
          fi
